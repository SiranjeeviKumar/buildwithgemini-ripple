<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ripple — Foresight Angle</title>
<!-- Google Fonts & Material Symbols -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined">
<style>
  :root {
    --accent: #4f46e5;
    --accent-hover: #4338ca;
    --accent-light: #eef2ff;
    --accent-gradient: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
    --bg: #f8fafc;
    --surface: #ffffff;
    --border: #e2e8f0;
    --text: #0f172a;
    --text-muted: #64748b;
    --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
    --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
    --radius: 16px;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    flex-direction: column;
    height: 100vh;
  }

  /* Header Bar */
  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 1rem 1.5rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    box-shadow: var(--shadow-sm);
    z-index: 10;
  }

  .brand-group {
    display: flex;
    align-items: center;
    gap: 0.75rem;
  }

  .brand-icon {
    width: 40px;
    height: 40px;
    border-radius: 12px;
    background: var(--accent-gradient);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.3rem;
    box-shadow: 0 4px 12px rgba(79, 70, 229, 0.25);
  }

  .brand-title {
    font-size: 1.15rem;
    font-weight: 700;
    letter-spacing: -0.02em;
    color: var(--text);
    margin: 0;
  }

  .brand-subtitle {
    font-size: 0.8rem;
    color: var(--text-muted);
    margin: 0.1rem 0 0 0;
    font-weight: 500;
  }

  .badge-tag {
    background: var(--accent-light);
    color: var(--accent);
    font-size: 0.75rem;
    font-weight: 600;
    padding: 0.3rem 0.6rem;
    border-radius: 20px;
    border: 1px solid rgba(79, 70, 229, 0.2);
  }

  /* Log Container */
  #log {
    flex: 1;
    overflow-y: auto;
    padding: 1.5rem;
    max-width: 820px;
    width: 100%;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 1.25rem;
  }

  /* Message Rows */
  .msg {
    display: flex;
    flex-direction: column;
    gap: 0.35rem;
    max-width: 85%;
    animation: fadeIn 0.25s ease-out;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .msg.user {
    align-self: flex-end;
    align-items: flex-end;
  }

  .msg.agent {
    align-self: flex-start;
    align-items: flex-start;
  }

  .msg-meta {
    display: flex;
    align-items: center;
    gap: 0.4rem;
    font-size: 0.75rem;
    font-weight: 600;
    color: var(--text-muted);
  }

  .bubble {
    padding: 0.9rem 1.1rem;
    border-radius: var(--radius);
    background: var(--surface);
    border: 1px solid var(--border);
    box-shadow: var(--shadow-sm);
    line-height: 1.55;
    font-size: 0.95rem;
    white-space: pre-wrap;
    word-break: break-word;
  }

  .msg.user .bubble {
    background: var(--accent-gradient);
    color: #ffffff;
    border: none;
    border-bottom-right-radius: 4px;
    box-shadow: 0 4px 12px rgba(79, 70, 229, 0.2);
  }

  .msg.agent .bubble {
    border-bottom-left-radius: 4px;
  }

  /* Rich Card Output Override */
  .bubble.rich {
    background: transparent;
    border: none;
    padding: 0;
    box-shadow: none;
    max-width: 100%;
    white-space: normal;
  }

  /* Prompt Suggestions Panel */
  .prompt-panel {
    max-width: 820px;
    width: 100%;
    margin: 0 auto;
    padding: 0 1.5rem 0.6rem 1.5rem;
  }

  .prompt-label {
    font-size: 0.75rem;
    font-weight: 600;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.04em;
    margin-bottom: 0.5rem;
  }

  .prompt-row {
    display: flex;
    gap: 0.6rem;
    overflow-x: auto;
    padding-bottom: 0.2rem;
  }

  .prompt-pill {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 0.55rem 0.9rem;
    border-radius: 20px;
    font-size: 0.825rem;
    font-weight: 500;
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.2s ease;
    display: flex;
    align-items: center;
    gap: 0.4rem;
    box-shadow: var(--shadow-sm);
  }

  .prompt-pill:hover {
    border-color: var(--accent);
    background: var(--accent-light);
    color: var(--accent);
    transform: translateY(-1px);
    box-shadow: var(--shadow-md);
  }

  /* Input Controls */
  .input-area {
    background: var(--surface);
    border-top: 1px solid var(--border);
    padding: 1rem 1.5rem 1.25rem 1.5rem;
  }

  form {
    max-width: 820px;
    margin: 0 auto;
    display: flex;
    gap: 0.75rem;
  }

  input {
    flex: 1;
    padding: 0.85rem 1.1rem;
    border: 1.5px solid var(--border);
    border-radius: 12px;
    font-size: 0.975rem;
    font-family: inherit;
    outline: none;
    transition: border-color 0.2s ease, box-shadow 0.2s ease;
    background: var(--bg);
  }

  input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
    background: #ffffff;
  }

  button {
    padding: 0.85rem 1.4rem;
    border: none;
    border-radius: 12px;
    background: var(--accent-gradient);
    color: #ffffff;
    font-weight: 600;
    font-size: 0.95rem;
    font-family: inherit;
    cursor: pointer;
    transition: transform 0.15s ease, box-shadow 0.2s ease;
    box-shadow: 0 4px 12px rgba(79, 70, 229, 0.25);
    display: flex;
    align-items: center;
    gap: 0.4rem;
  }

  button:hover {
    transform: translateY(-1px);
    box-shadow: 0 6px 16px rgba(79, 70, 229, 0.35);
  }

  button:active {
    transform: translateY(0);
  }

  /* A2UI Component Styles */
  .a2card {
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 1.2rem;
    background: #ffffff;
    box-shadow: var(--shadow-md);
    max-width: 100%;
  }

  .a2card + .a2card, .a2col > .a2card { margin-top: 0.75rem; }
  .a2col { display: flex; flex-direction: column; gap: 0.5rem; }
  .a2row { display: flex; flex-direction: row; gap: 0.75rem; align-items: center; flex-wrap: wrap; }
  .a2row.between { justify-content: space-between; }
  .a2text { margin: 0; line-height: 1.5; color: var(--text); }
  .a2text.a2-h1 { font-size: 1.4rem; font-weight: 700; color: #1e1b4b; }
  .a2text.a2-h2 { font-size: 1.2rem; font-weight: 700; color: #1e1b4b; }
  .a2text.a2-h3 { font-size: 1.05rem; font-weight: 600; color: #312e81; }
  .a2text.a2-h4 { font-size: 0.95rem; font-weight: 600; color: #312e81; }
  .a2text.a2-caption { font-size: 0.85rem; color: var(--text-muted); }
  .a2divider { border: none; border-top: 1px solid var(--border); margin: 0.5rem 0; width: 100%; }
  .a2img { max-width: 100%; border-radius: 12px; display: block; margin-top: 0.4rem; box-shadow: var(--shadow-sm); }
  .material-symbols-outlined { font-family: 'Material Symbols Outlined'; font-size: 1.25rem; line-height: 1; vertical-align: middle; color: var(--accent); }
</style>
</head>
<body>

<header>
  <div class="brand-group">
    <div class="brand-icon">🔮</div>
    <div>
      <h1 class="brand-title">Ripple</h1>
      <p class="brand-subtitle">Foresight Angle — Anticipatory Intelligence Engine</p>
    </div>
  </div>
  <span class="badge-tag">🇮🇳 India Context</span>
</header>

<div id="log"></div>

<div class="prompt-panel">
  <div class="prompt-label">Example Life Decision Scenarios</div>
  <div class="prompt-row">
    <button class="prompt-pill" data-prompt="Calculate 5 year TCO for buying a ₹15 Lakh SUV with ₹5,000 monthly maintenance in Bengaluru">
      🚗 <span>Buying ₹15 Lakh Car in BLR</span>
    </button>
    <button class="prompt-pill" data-prompt="Simulate lifestyle friction of adopting a Golden Retriever in a 4th floor Mumbai apartment without lift">
      🐕 <span>Golden Retriever in Mumbai Walkup</span>
    </button>
    <button class="prompt-pill" data-prompt="Financial stress test for quitting ₹24 LPA IT job for a 6-month AI bootcamp">
      💼 <span>Quitting ₹24 LPA Job for Bootcamp</span>
    </button>
  </div>
</div>

<div class="input-area">
  <form id="form">
    <input id="input" placeholder="Stress-test a major decision (e.g. buying a car, moving, career pivot)..." autocomplete="off" autofocus>
    <button type="submit">
      <span>Send</span>
      <span class="material-symbols-outlined" style="color:#fff; font-size:1.1rem;">send</span>
    </button>
  </form>
</div>

<script>
const log = document.getElementById("log");
const form = document.getElementById("form");
const input = document.getElementById("input");

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}

function bubble(who) {
  const m = el("div", "msg " + who);
  const meta = el("div", "msg-meta", who === "user" ? "You" : "🔮 Ripple");
  const b = el("div", "bubble");
  m.appendChild(meta);
  m.appendChild(b);
  log.appendChild(m);
  log.scrollTop = log.scrollHeight;
  return b;
}

/* ----------------------------------------------------------------------------
 * A2UI mini-renderer (v0.8 Basic Catalog subset).
 * Renders Card / Column / Row / Text / Divider / List / Image / Icon.
 * -------------------------------------------------------------------------- */

function boundStr(v) {
  if (v == null) return "";
  if (typeof v === "string") return v;
  if (typeof v.literalString === "string") return v.literalString;
  return "";
}

function childIds(props) {
  const ids = [];
  if (props && typeof props.child === "string") ids.push(props.child);
  const ch = props && props.children;
  if (ch && Array.isArray(ch.explicitList)) for (const c of ch.explicitList) if (typeof c === "string") ids.push(c);
  return ids;
}

function iconName(n) { return String(n || "").replace(/([a-z0-9])([A-Z])/g, "$1_$2").replace(/\s+/g, "_").toLowerCase(); }

function buildNode(id, comps, seen) {
  if (!id || seen.has(id)) return null;
  seen.add(id);
  const spec = comps[id];
  if (!spec || typeof spec !== "object") return null;
  const type = Object.keys(spec)[0];
  const props = spec[type] || {};
  const kids = () => childIds(props).map(cid => buildNode(cid, comps, seen)).filter(Boolean);

  switch (type) {
    case "Card": {
      const d = el("div", "a2card"); kids().forEach(n => d.appendChild(n)); return d;
    }
    case "Column":
    case "List": {
      const horizontal = type === "List" && props.direction === "horizontal";
      const d = el("div", horizontal ? "a2row" : "a2col"); kids().forEach(n => d.appendChild(n)); return d;
    }
    case "Row": {
      const d = el("div", "a2row" + (props.distribution === "spaceBetween" ? " between" : ""));
      kids().forEach(n => d.appendChild(n)); return d;
    }
    case "Text": {
      const t = el("div", "a2text");
      const hint = String(props.usageHint || "body").toLowerCase();
      if (["h1", "h2", "h3", "h4", "h5", "h6"].includes(hint)) t.classList.add("a2-" + hint);
      else if (hint === "caption") t.classList.add("a2-caption");
      t.textContent = boundStr(props.text);
      return t;
    }
    case "Divider":
      return el("hr", "a2divider");
    case "Image": {
      const src = boundStr(props.url || props.src);
      if (!/^https?:\/\//i.test(src)) return null;
      const img = el("img", "a2img"); img.src = src; img.alt = boundStr(props.alt) || ""; return img;
    }
    case "Icon": {
      const s = el("span", "material-symbols-outlined"); s.textContent = iconName(boundStr(props.name) || props.name); return s;
    }
    default:
      return null;
  }
}

function renderSurface(messages, container) {
  const comps = {};
  const roots = [];
  for (const m of messages) {
    if (m.beginRendering && typeof m.beginRendering.root === "string") roots.push(m.beginRendering.root);
    const su = m.surfaceUpdate;
    if (su && Array.isArray(su.components)) for (const c of su.components) if (c && c.id && c.component) comps[c.id] = c.component;
  }
  let rootIds = roots.filter(r => comps[r]);
  if (rootIds.length === 0) {
    const referenced = new Set();
    for (const id in comps) { const spec = comps[id]; childIds(spec[Object.keys(spec)[0]] || {}).forEach(c => referenced.add(c)); }
    rootIds = Object.keys(comps).filter(id => !referenced.has(id));
  }
  let drew = false;
  for (const rid of rootIds) { const node = buildNode(rid, comps, new Set()); if (node) { container.appendChild(node); drew = true; } }
  return drew;
}

function flattenText(messages) {
  const out = [];
  for (const m of messages) {
    const su = m.surfaceUpdate;
    if (su && Array.isArray(su.components)) for (const c of su.components) if (c && c.component && c.component.Text) out.push(boundStr(c.component.Text.text));
  }
  return out.join("\n").trim();
}

function renderReply(b, parts) {
  b.textContent = "";
  const texts = parts.filter(p => p && (p.kind === "text" || (!p.kind && p.text))).map(p => p.text || "");
  const a2ui = parts.filter(p => p && p.kind === "a2ui" && p.data).map(p => p.data);

  const textStr = texts.join("\n").trim();
  if (textStr) b.appendChild(el("div", null, textStr));

  if (a2ui.length) {
    b.classList.add("rich");
    if (!renderSurface(a2ui, b)) b.appendChild(el("div", null, flattenText(a2ui) || "(no card content)"));
  }
  if (!b.childNodes.length) b.textContent = "(no response)";
  log.scrollTop = log.scrollHeight;
}

// Prompt pill handler
document.querySelectorAll(".prompt-pill").forEach(pill => {
  pill.addEventListener("click", () => {
    const prompt = pill.getAttribute("data-prompt");
    if (prompt) {
      input.value = prompt;
      form.dispatchEvent(new Event("submit", { cancelable: true, bubbles: true }));
    }
  });
});

// Chat submit handler
form.addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const text = input.value.trim();
  if (!text) return;
  bubble("user").textContent = text;
  input.value = "";
  const b = bubble("agent");
  b.textContent = "Analyzing compounding consequences...";
  try {
    const res = await fetch("/chat", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ message: text }) });
    const raw = await res.text();
    let data;
    try { data = JSON.parse(raw); }
    catch { throw new Error(`Server returned non-JSON (HTTP ${res.status}). ${raw.slice(0, 300)}`); }
    renderReply(b, data.parts || []);
  } catch (e) {
    b.textContent = "Error: " + e.message;
  }
});
</script>
</body>
</html>
